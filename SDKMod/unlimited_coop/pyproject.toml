[project]
name = "unlimited_coop"
version = "1.0"
authors = [{ name = "Robeth" }, { name = "AstrandPallas" }]
description = """\
Allows more than 4 players in a COOP game. Every player gets their own team, and the Unlimited COOP patch settings are applied on every map change.
"""

[project.urls]
Homepage = "https://github.com/AstrandPallas/BL2-MP-Mods"

[tool.sdkmod]
name = "Unlimited COOP"
supported_games = ["BL2"]
coop_support = "HostOnly"
download = "https://github.com/AstrandPallas/BL2-MP-Mods/releases/latest"

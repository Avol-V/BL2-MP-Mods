name: SDK mod checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s SDKMod/tests -v
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./SDKMod/tests/Test-Launcher.ps1
      - run: python SDKMod/tools/build_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: unlimited-coop-sdk-${{ matrix.os }}
          path: SDKMod/dist/*
